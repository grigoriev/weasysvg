<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320">
  <rect x="0" y="0" width="500" height="320" fill="#f4f6fb" stroke="#334"/>
  <g transform="translate(20,20)">
    <rect width="220" height="130" rx="8" fill="#fff" stroke="#36c"/>
    <foreignObject width="220" height="130">
      <div xmlns="http://www.w3.org/1999/xhtml" style="padding:8px;font-family:sans-serif;font-size:13px;color:#222">
        <h3 style="margin:0 0 4px;color:#36c">Heading</h3>
        <ul style="margin:0;padding-left:18px"><li><b>Bold</b> item</li><li><i>Italic</i> item</li><li><span style="background:#ff0">Highlighted</span> item</li></ul>
      </div>
    </foreignObject>
  </g>
  <g transform="translate(260,20) scale(1.2)">
    <rect width="180" height="100" fill="#fff" stroke="#c33"/>
    <foreignObject width="180" height="100">
      <table xmlns="http://www.w3.org/1999/xhtml" style="border-collapse:collapse;font:11px sans-serif;width:100%">
        <tr><th style="border:1px solid #999;background:#eee">Key</th><th style="border:1px solid #999;background:#eee">Value</th></tr>
        <tr><td style="border:1px solid #999">alpha</td><td style="border:1px solid #999">1</td></tr>
        <tr><td style="border:1px solid #999">beta</td><td style="border:1px solid #999">2</td></tr>
      </table>
    </foreignObject>
  </g>
  <g transform="translate(40,190) rotate(-8)">
    <rect width="420" height="100" fill="#ffe" stroke="#990"/>
    <foreignObject width="420" height="100">
      <p xmlns="http://www.w3.org/1999/xhtml" style="margin:10px;font:16px serif;text-align:justify">Rotated paragraph with automatic line wrapping. Grüezi, Привет, 日本語. The text should wrap inside the box and stay clipped by its bounds.</p>
    </foreignObject>
  </g>
</svg>
