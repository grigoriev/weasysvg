<svg xmlns="http://www.w3.org/2000/svg" width="232" height="128" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="232" height="128"></rect>
  <text x="122" y="44" >Hello</text>
  <polygon points="216,36 224,40 216,44" class="filled"></polygon>
  <polygon points="136,76 140,64 144,76" class="filled"></polygon>
  <g>
    <path d="M 40,24 A 8,8 0,0,0 34,28" class="nofill"></path>
    <line x1="34" y1="28" x2="24" y2="48" class="solid"></line>
    <line x1="40" y1="24" x2="64" y2="24" class="solid"></line>
    <path d="M 64,24 A 8,8 0,0,1 70,28" class="nofill"></path>
    <line x1="70" y1="28" x2="80" y2="48" class="solid"></line>
    <line x1="24" y1="48" x2="34" y2="68" class="solid"></line>
    <line x1="80" y1="48" x2="70" y2="68" class="solid"></line>
    <path d="M 34,68 A 8,8 0,0,0 40,72" class="nofill"></path>
    <line x1="40" y1="72" x2="64" y2="72" class="solid"></line>
    <path d="M 70,68 A 8,8 0,0,1 64,72" class="nofill"></path>
  </g>
  <g>
    <path d="M 116,24 A 8,8 0,0,0 108,32" class="nofill"></path>
    <line x1="116" y1="24" x2="176" y2="24" class="solid"></line>
    <path d="M 176,24 A 4,4 0,0,1 180,28" class="nofill"></path>
    <line x1="180" y1="28" x2="180" y2="48" class="solid"></line>
    <line x1="108" y1="32" x2="108" y2="52" class="solid"></line>
    <line x1="180" y1="40" x2="216" y2="40" class="solid"></line>
    <path d="M 108,52 A 4,4 0,0,0 112,56" class="nofill"></path>
    <line x1="112" y1="56" x2="172" y2="56" class="solid"></line>
    <path d="M 180,48 A 8,8 0,0,1 172,56" class="nofill"></path>
  </g>
  <g>
    <line x1="140" y1="76" x2="140" y2="104" class="solid"></line>
    <line x1="44" y1="104" x2="140" y2="104" class="solid"></line>
  </g>
</svg>
