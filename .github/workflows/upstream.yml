name: Upstream

# Weekly, weasysvg against the newest WeasyPrint: the latest release and the main branch.
# A red run is the early warning for an upgrade (UPGRADING.md). It gates no pull request.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        weasyprint: ["release", "main"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pango and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core fonts-liberation fonts-noto-color-emoji

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.14

      # The project pins WeasyPrint to the version it supports: lift the pin for this run only. A newer
      # WeasyPrint may drop the oldest Python weasysvg supports; the run uses 3.14 alone.
      - name: Install the newest WeasyPrint
        env:
          UV_PYTHON: "3.14"
          TARGET: ${{ matrix.weasyprint }}
        run: |
          sed -i 's/^requires-python = .*/requires-python = ">=3.14"/' pyproject.toml
          if [ "$TARGET" = main ]; then
            uv add --no-sync "weasyprint @ git+https://github.com/Kozea/WeasyPrint@main"
          else
            uv add --no-sync "weasyprint>=70" --upgrade-package weasyprint
          fi
          uv sync --all-extras
          uv run python -c "import weasyprint; print('WeasyPrint', weasyprint.__version__)"

      - name: Tests
        id: tests
        continue-on-error: true
        env:
          UV_PYTHON: "3.14"
        run: uv run --no-sync pytest tests/ -q

      - name: Probes and hooks
        id: probes
        continue-on-error: true
        env:
          UV_PYTHON: "3.14"
        run: uv run --no-sync pytest upstream -q

      - name: Summary
        env:
          TARGET: ${{ matrix.weasyprint }}
          TESTS: ${{ steps.tests.outcome }}
          PROBES: ${{ steps.probes.outcome }}
        run: |
          {
            echo "## WeasyPrint $TARGET"
            echo "- tests: $TESTS"
            echo "- probes and hooks: $PROBES"
            echo
            echo "A failed probe names a patch WeasyPrint made redundant, a changed hook the code to review."
            echo "Follow UPGRADING.md."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$TESTS" = success ] && [ "$PROBES" = success ]
