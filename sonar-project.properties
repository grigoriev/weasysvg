sonar.projectKey=grigoriev_weasysvg
sonar.organization=grigoriev

sonar.sources=src,tools
sonar.tests=tests,upstream

sonar.python.version=3.10,3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/*.pyc

# The bench and the corpus script are dev tools that run in Docker or against the network, not under pytest
sonar.coverage.exclusions=tests/**,tools/**

# python:S7504 flags list() around a loop over the tree. These loops remove children of the tree they
# walk, and ElementTree leaves iteration over a changing tree undefined: the copy is required.
sonar.issue.ignore.multicriteria=treecopy1,treecopy2,treecopy3,benchpath
sonar.issue.ignore.multicriteria.treecopy1.ruleKey=python:S7504
sonar.issue.ignore.multicriteria.treecopy1.resourceKey=src/weasysvg/conditional.py
sonar.issue.ignore.multicriteria.treecopy2.ruleKey=python:S7504
sonar.issue.ignore.multicriteria.treecopy2.resourceKey=src/weasysvg/foreign_object.py
sonar.issue.ignore.multicriteria.treecopy3.ruleKey=python:S7504
sonar.issue.ignore.multicriteria.treecopy3.resourceKey=src/weasysvg/text.py

# pythonsecurity:S2083 takes the corpus files the bench reads as user input. The bench is a local dev tool,
# no service: it runs from the command line, and bench.inside() keeps every path in the repository.
sonar.issue.ignore.multicriteria.benchpath.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.benchpath.resourceKey=tools/visual/bench.py
