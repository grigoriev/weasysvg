[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weasysvg"
version = "0.3.1"
description = "Native SVG rendering for WeasyPrint, close to Chromium: foreignObject, filters, masks, blending and text."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergey Grigoriev", email = "grigoriev@fastmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Printing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # ink.py reads glyph outlines; WeasyPrint 70 requires it already
    "fonttools>=4.59.2",
    "weasyprint>=70,<71",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.17.3",
    "pypdfium2==5.14.0",
]
# The visual regression bench in tools/visual, run in Docker
visual = [
    "numpy==2.5.4; python_version >= '3.12'",
    "playwright==1.64.1",
    "resvg-py==0.5.0",
]

[project.urls]
Homepage = "https://github.com/grigoriev/weasysvg"
Repository = "https://github.com/grigoriev/weasysvg"
Issues = "https://github.com/grigoriev/weasysvg/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/weasysvg"]

[tool.hatch.build.targets.sdist]
include = ["src/weasysvg", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["weasysvg"]

[tool.uv]
required-version = ">=0.5.0"

[tool.coverage.run]
source = ["weasysvg"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
show_error_codes = true

# WeasyPrint and its CSS parsers ship no type information
[[tool.mypy.overrides]]
module = ["weasyprint.*", "weasyprint", "pydyf", "pypdfium2.*", "numpy.*", "fontTools.*", "tinycss2", "tinycss2.*", "cssselect2"]
ignore_missing_imports = true
